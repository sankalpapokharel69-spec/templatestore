<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password — WebCraft Studio</title>
<meta name="description" content="Reset your WebCraft Studio account password.">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 34 34'%3E%3Crect width='34' height='34' rx='9' fill='%236366f1'/%3E%3Cpath d='M9 11l4 12 4-9 4 9 4-12' stroke='white' stroke-width='2.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<script>document.documentElement.dataset.theme=localStorage.getItem('wc_theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');</script>
</head>
<body data-page="forgot">
<header id="site-header"></header>
<main class="container auth-wrap">
  <div class="auth-card">
    <div id="forgot-block">
      <h1>Forgot your password?</h1>
      <p>Enter your account email and we'll generate a reset link.</p>
      <form id="forgot-form" novalidate>
        <div class="field"><label for="fp-email">Email</label><input id="fp-email" name="email" type="email" required autocomplete="email"></div>
        <button class="btn btn-primary btn-lg btn-block" type="submit">Send reset link</button>
      </form>
    </div>
    <div id="forgot-msg" class="auth-block" hidden></div>
    <div id="reset-block" hidden>
      <h1>Choose a new password</h1>
      <p>Pick a strong password of at least 8 characters.</p>
      <form id="reset-form" novalidate>
        <input type="hidden" name="token" id="reset-token">
        <div class="field"><label for="rp-pass">New password</label><input id="rp-pass" name="password" type="password" required minlength="8" maxlength="100" autocomplete="new-password"></div>
        <div class="field"><label for="rp-pass2">Confirm new password</label><input id="rp-pass2" name="confirm" type="password" required minlength="8" autocomplete="new-password"></div>
        <button class="btn btn-primary btn-lg btn-block" type="submit">Reset password</button>
      </form>
    </div>
    <p class="auth-alt"><a href="login.html">← Back to sign in</a></p>
  </div>
</main>
<footer id="site-footer"></footer>
<script src="config.js"></script>
<script src="js/main.js"></script>
<script src="js/app.js"></script>
</body>
</html>
