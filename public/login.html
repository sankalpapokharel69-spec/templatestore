<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In — WebCraft Studio</title>
<meta name="description" content="Sign in to your WebCraft Studio account.">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 34 34'%3E%3Crect width='34' height='34' rx='9' fill='%236366f1'/%3E%3Cpath d='M9 11l4 12 4-9 4 9 4-12' stroke='white' stroke-width='2.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<script>document.documentElement.dataset.theme=localStorage.getItem('wc_theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');</script>
</head>
<body data-page="login">
<header id="site-header"></header>
<main class="container auth-wrap">
  <div class="auth-card">
    <h1>Welcome back</h1>
    <p>Sign in to access your orders and downloads.</p>
    <form id="login-form" novalidate>
      <div class="field"><label for="l-email">Email</label><input id="l-email" name="email" type="email" required autocomplete="email"></div>
      <div class="field"><label for="l-pass">Password</label><input id="l-pass" name="password" type="password" required autocomplete="current-password"></div>
      <button class="btn btn-primary btn-lg btn-block" type="submit">Sign in</button>
    </form>
    <p class="auth-alt"><a href="forgot-password.html">Forgot your password?</a></p>
    <p class="auth-alt">New here? <a href="register.html">Create an account</a></p>
  </div>
</main>
<footer id="site-footer"></footer>
<script src="config.js"></script>
<script src="js/main.js"></script>
<script src="js/app.js"></script>
</body>
</html>
