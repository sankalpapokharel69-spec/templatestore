<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Template Library — WebCraft Studio</title>
<meta name="description" content="Browse premium website templates by category and price. Restaurants, hotels, salons, real estate, gyms, photography, portfolios and business.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 34 34'%3E%3Crect width='34' height='34' rx='9' fill='%236366f1'/%3E%3Cpath d='M9 11l4 12 4-9 4 9 4-12' stroke='white' stroke-width='2.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<script>document.documentElement.dataset.theme=localStorage.getItem('wc_theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');</script>
</head>
<body data-page="templates">
<header id="site-header"></header>
<main class="container page-wrap">
  <div class="page-head">
    <h1>Template Library</h1>
    <p id="result-count">Loading…</p>
  </div>
  <form class="filter-bar" id="filter-form" onsubmit="return false;" role="search" aria-label="Template filters">
    <div class="filter-search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input type="search" id="f-search" placeholder="Search templates…" aria-label="Search templates">
    </div>
    <select id="f-category" aria-label="Filter by category"></select>
    <div class="price-inputs">
      <input type="number" id="f-min" placeholder="Min $" min="0" aria-label="Minimum price">
      <span class="muted">–</span>
      <input type="number" id="f-max" placeholder="Max $" min="0" aria-label="Maximum price">
    </div>
    <select id="f-sort" aria-label="Sort templates">
      <option value="newest">Newest first</option>
      <option value="price-asc">Price: low to high</option>
      <option value="price-desc">Price: high to low</option>
    </select>
    <button type="button" class="btn btn-ghost btn-sm" id="f-clear">Clear</button>
  </form>
  <div class="t-grid" id="templates-grid"></div>
  <nav class="pagination" id="pagination" aria-label="Pagination"></nav>
</main>
<footer id="site-footer"></footer>
<script src="config.js"></script>
<script src="js/main.js"></script>
<script src="js/app.js"></script>
</body>
</html>
